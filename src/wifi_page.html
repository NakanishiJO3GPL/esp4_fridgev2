<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最新のトリガーフレーム</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #16191d; color: #f0f2f4; }
    main { width: min(100%, 1000px); margin: auto; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.2rem, 4vw, 1.7rem); }
    #state, #trigger { min-height: 1.5em; margin: 0 0 16px; color: #cbd3dc; }
    figure { margin: 0; padding: 12px; border-radius: 12px; background: #22272e; }
    #image { display: block; width: 100%; height: auto; max-height: 75vh; object-fit: contain; }
    [hidden] { display: none !important; }
    #placeholder { padding: 64px 12px; text-align: center; color: #cbd3dc; }
    figcaption { display: flex; flex-wrap: wrap; gap: 8px 24px; padding-top: 12px; font-size: .9rem; }
    @media (max-width: 480px) { main { padding: 12px; } figure { padding: 8px; } }
  </style>
</head>
<body>
  <main>
    <h1>最新のトリガーフレーム</h1>
    <p id="state" role="status" aria-live="polite">接続中…</p>
    <p id="trigger" role="status" aria-live="polite">撮影トリガーを待っています</p>
    <figure>
      <img id="image" alt="最新のトリガーフレーム" hidden>
      <div id="placeholder">画像を待っています</div>
      <figcaption>
        <span>フレーム: <span id="frame">—</span></span>
        <span>サイズ: <span id="bytes">—</span></span>
      </figcaption>
    </figure>
  </main>
  <script>
    (() => {
      'use strict';
      const image = document.getElementById('image');
      const placeholder = document.getElementById('placeholder');
      const state = document.getElementById('state');
      const trigger = document.getElementById('trigger');
      const frame = document.getElementById('frame');
      const bytes = document.getElementById('bytes');
      let accepted = null;
      let lastTrigger = null;
      let currentUrl = null;
      let timer = null;
      let running = false;
      let wakeRequested = false;
      let failures = 0;

      function checkAbort(signal) {
        if (signal.aborted) throw new Error('timeout');
      }

      function updateTrigger(response) {
        const text = response.headers.get('X-Fridge-Trigger');
        if (text === null) return;
        const match = /^([0-9a-f]{16}):([0-9]+):([0-9]+)$/i.exec(text);
        if (!match || match[0] !== text) return;
        const boot = match[1].toLowerCase();
        const event = Number(match[2]);
        const sequence = Number(match[3]);
        if (![event, sequence].every(value =>
          Number.isInteger(value) && value >= 0 && value <= 0xffffffff)) return;
        if (lastTrigger && lastTrigger.boot === boot && lastTrigger.event === event) return;
        lastTrigger = { boot, event };
        trigger.textContent = event === 0 ? '撮影トリガーを待っています' :
          '撮影トリガーを検出しました（フレーム ' + sequence + '）。';
      }

      function checkResponse(response) {
        if (!response.ok) {
          const error = new Error('HTTP ' + response.status);
          error.noImage = response.status === 503;
          error.stale = response.status === 409;
          throw error;
        }
      }

      async function poll() {
        const controller = new AbortController();
        let candidateUrl = null;
        let phase = '/latest.jpg';
        let timeout;
        const deadline = new Promise((_, reject) => {
          timeout = setTimeout(() => {
            controller.abort();
            reject(new Error('timeout'));
          }, 10000);
        });
        const transaction = async () => {
          const options = { cache: 'no-store', signal: controller.signal };
          const path = '/latest.jpg' + (accepted ?
            '?boot=' + encodeURIComponent(accepted.boot_id) +
            '&version=' + encodeURIComponent(accepted.version) : '');
          const response = await fetch(path, options);
          checkAbort(controller.signal);
          updateTrigger(response);
          checkResponse(response);
          if (response.status === 204) {
            if (!accepted) throw new Error('unexpected unchanged image');
            return;
          }
          const numberHeader = name => {
            const text = response.headers.get(name);
            return text !== null && /^\d+$/.test(text) ? Number(text) : NaN;
          };
          const snapshot = {
            boot_id: response.headers.get('X-Fridge-Boot'),
            version: numberHeader('X-Fridge-Version'),
            frame_sequence: numberHeader('X-Fridge-Frame'),
            bytes: numberHeader('X-Fridge-Bytes'),
          };
          if (!snapshot || typeof snapshot.boot_id !== 'string' ||
              !/^[0-9a-f]+$/i.test(snapshot.boot_id) ||
              !['version', 'frame_sequence', 'bytes'].every(key =>
                Number.isSafeInteger(snapshot[key]) && snapshot[key] >= 0)) {
            throw new Error('invalid status');
          }
          const blob = await response.blob();
          if (blob.size !== snapshot.bytes) throw new Error('incomplete JPEG');
          checkAbort(controller.signal);
          candidateUrl = URL.createObjectURL(blob);
          phase = 'JPEG decode';
          const decoded = new Image();
          decoded.src = candidateUrl;
          await decoded.decode();
          // A timed-out decode may finish after a newer poll has already started.
          checkAbort(controller.signal);
          const previousUrl = currentUrl;
          image.src = candidateUrl;
          image.hidden = false;
          placeholder.hidden = true;
          frame.textContent = String(snapshot.frame_sequence);
          bytes.textContent = snapshot.bytes.toLocaleString('ja-JP') + ' B';
          accepted = snapshot;
          currentUrl = candidateUrl;
          candidateUrl = null;
          if (previousUrl !== null) URL.revokeObjectURL(previousUrl);
        };
        try {
          await Promise.race([transaction(), deadline]);
        } catch (error) {
          error.phase = phase;
          throw error;
        } finally {
          clearTimeout(timeout);
          if (candidateUrl !== null) URL.revokeObjectURL(candidateUrl);
        }
      }

      async function run() {
        if (running) return;
        running = true;
        timer = null;
        let delay = 200;
        try {
          await poll();
          failures = 0;
          state.textContent = '接続中・最新のトリガーフレーム';
        } catch (error) {
          if (error.stale) {
            delay = 200;
            state.textContent = '画像を更新中…' + (accepted ? ' 前の画像を表示中。' : '');
          } else {
            failures = Math.min(failures + 1, 4);
            delay = Math.min(1000 * 2 ** (failures - 1), 5000);
            const details = (error.phase || '通信') + ': ' + error.message;
            state.textContent = (error.noImage ? '画像がありません。再試行します。' :
              error.phase === 'JPEG decode' ? '画像を表示できません。再試行します。' :
              'オフライン・再試行します。') + ' (' + details + ')' +
              (accepted ? ' 前の画像を表示中。' : '');
          }
        } finally {
          running = false;
          // Wake events coalesce; they never start a second in-flight poll.
          timer = setTimeout(run, wakeRequested ? 0 : delay);
          wakeRequested = false;
        }
      }

      function wake() {
        if (running) {
          wakeRequested = true;
          return;
        }
        clearTimeout(timer);
        void run();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') wake();
      });
      window.addEventListener('online', wake);
      wake();
    })();
  </script>
</body>
</html>
