[build]
target = "riscv32imafc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32p4"
# Official IDF 6.1 release commit; keep in sync with idf/official_sdk.cmake.
ESP_IDF_VERSION = { value = "commit:fff9895c82d744c7237be8847347bdd1b07c6643", force = true }
ESP_IDF_REPOSITORY = { value = "https://github.com/espressif/esp-idf.git", force = true }
ESP_IDF_TOOLS_INSTALL_DIR = "global"

# Uncomment this if you have moved the target dir by setting CARGO_TARGET_DIR or similar.
# Required for now due to embuild limitations.
#CARGO_WORKSPACE_DIR = { value = "", relative = true }
